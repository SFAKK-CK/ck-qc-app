<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff4f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CK QC PC">
<title>CK QC · PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ink:#1b1c1a; --ink-2:#3a3b39; --ink-3:#6b6e69; --ink-4:#9a9d97;
  --accent:#2d5a87; --accent-soft:#dfe9f3; --accent-ink:#1c3d5e;
  --teal:#3a7c7e; --teal-soft:#dceae8;
  --amber:#8c5520; --amber-soft:#f5e9d4; --amber-ink:#6e4318;
  --green:#2e6b3c; --green-soft:#dbe9d5;
  --red:#9b2226; --red-soft:#f3dada; --red-ink:#7a1a1d;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.35); --glass-line:rgba(255,255,255,.75);
  --glass-fx:blur(20px) saturate(180%);
  --shadow:0 6px 18px -10px rgba(50,60,80,.2), inset 0 1px 0 rgba(255,255,255,.7);
  --ease:cubic-bezier(.22,1,.36,1);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Manrope','Sarabun','Noto Sans Myanmar',-apple-system,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;overflow:hidden;
  background:
    radial-gradient(at 18% 15%,rgba(135,206,250,.65) 0%,transparent 45%),
    radial-gradient(at 80% 10%,rgba(100,220,200,.55) 0%,transparent 50%),
    radial-gradient(at 85% 80%,rgba(72,200,160,.5) 0%,transparent 50%),
    radial-gradient(at 10% 85%,rgba(150,230,255,.55) 0%,transparent 50%),
    linear-gradient(135deg,#dff4f9 0%,#e8f9f4 50%,#d6f0f8 100%);
  background-size:200% 200%,200% 200%,200% 200%,200% 200%,100% 100%;
  animation:aurora 22s ease-in-out infinite}
body.lang-th{font-family:'Sarabun','Manrope','Noto Sans Myanmar',-apple-system,system-ui,sans-serif}
@keyframes aurora{0%,100%{background-position:0% 0%,100% 0%,100% 100%,0% 100%,0% 0%}50%{background-position:30% 30%,70% 30%,70% 70%,30% 70%,0% 0%}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform 140ms var(--ease),background 240ms var(--ease),box-shadow 240ms var(--ease),border-color 240ms var(--ease),opacity 200ms}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{cursor:not-allowed}
select option{color:var(--ink)}
.app{height:100%;display:flex;justify-content:center}
.phone{position:relative;isolation:isolate;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
#main{overflow-x:hidden}
.tabs{overscroll-behavior-x:contain}
@media(min-width:700px){.app{padding:16px}.phone{border-radius:32px;border:1px solid rgba(255,255,255,.55);box-shadow:0 30px 90px -30px rgba(40,40,60,.22);max-height:940px}}
.orb{position:absolute;z-index:-1;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none}
.orb.o1{width:260px;height:260px;background:#9fd8ef;top:-90px;right:-90px;animation:bob 10s ease-in-out infinite}
.orb.o2{width:220px;height:220px;background:#a8e6cf;bottom:80px;left:-80px;animation:bob 9s ease-in-out infinite reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx);border:1px solid var(--glass-line);box-shadow:var(--shadow)}

/* header (iOS nav bar) */
#hdr{flex:none;padding:calc(10px + env(safe-area-inset-top,0)) 16px 10px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.6);display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htitle{display:flex;align-items:center;gap:8px;min-width:0}
.htitle>div{min-width:0}
.htitle b,.htitle small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle b{font-size:17px;line-height:1.2}
.htitle small{font-size:12px;color:var(--ink-3)}
.back{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.6);font-size:22px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.hright{display:flex;align-items:center;gap:6px;flex:none}
.logout{font-size:12px;font-weight:700;color:var(--red-ink);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7)}
.langs{display:flex;gap:2px;background:rgba(40,42,50,.07);padding:3px;border-radius:999px;flex:none}
.langs button{border-radius:999px;padding:5px 7px;font-size:13px;font-weight:600;color:var(--ink-3)}
.langs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,22,18,.12)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.steps div{display:flex;flex-direction:column;gap:3px}
.steps i{height:5px;border-radius:3px;background:rgba(40,42,50,.12);transition:background 380ms var(--ease)}
.steps .sd i{background:var(--green)}.steps .sn i{background:var(--accent)}
.steps span{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .sn span{font-weight:700;color:var(--ink)}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.who span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;font-weight:700;flex:none}
.net::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.net.on{background:var(--green-soft);color:var(--green)}.net.on::before{animation:live 2s ease-in-out infinite}
.net.off{background:var(--red-soft);color:var(--red);animation:offp 1.4s ease-in-out infinite}
.net.wait{background:var(--amber-soft);color:var(--amber)}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(46,107,60,.45)}50%{box-shadow:0 0 0 5px rgba(46,107,60,0)}}
@keyframes offp{0%,100%{box-shadow:0 0 0 0 var(--red-soft)}50%{box-shadow:0 0 0 6px transparent}}
.demo{background:var(--amber-soft);color:var(--amber-ink);font-size:12px;font-weight:700;text-align:center;padding:4px 8px;border-radius:8px}

/* content */
#main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{width:0}
#main.enter{animation:cardIn 380ms var(--ease) both}
#main.enter .stg>*{animation:cardIn 380ms var(--ease) both}
#main.enter .stg>*:nth-child(2){animation-delay:60ms}#main.enter .stg>*:nth-child(3){animation-delay:120ms}
#main.enter .stg>*:nth-child(4){animation-delay:180ms}#main.enter .stg>*:nth-child(5){animation-delay:240ms}#main.enter .stg>*:nth-child(n+6){animation-delay:300ms}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pop{animation:cardIn 380ms var(--ease) both}
.stg{display:flex;flex-direction:column;gap:12px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink-3)}
.lbl{font-size:13px;font-weight:600;color:var(--ink-3)}
.card{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mono{font-family:var(--mono)}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--green-soft);color:var(--green)}.p-bad{background:var(--red);color:#fff}.p-warn{background:var(--amber-soft);color:var(--amber)}.p-mute{background:rgba(40,42,50,.08);color:var(--ink-3)}.p-fix{background:var(--amber-soft);color:var(--amber-ink)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.err{background:var(--red-soft);color:var(--red-ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.note{background:var(--amber-soft);color:var(--amber-ink);border:1.5px dashed var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}

/* login */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-top:6px}
.mark{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:38px;animation:bob 4s ease-in-out infinite}
.mark span{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.brand{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.otp{display:flex;justify-content:center;gap:6px}
.otp i{width:42px;height:56px;border-radius:12px;display:grid;place-items:center;font:600 24px var(--mono);font-style:normal;border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.55);transition:transform 140ms var(--ease),border-color 240ms,background 240ms}
.otp i.now{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}

/* home */
.greet{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;background:linear-gradient(145deg,var(--teal),#2a5a5b);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.04em}
.signout{font-size:13px;font-weight:600;color:var(--ink-3);padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5)}
.sum{display:flex;align-items:center}
.sum>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.sum b{font:700 26px var(--mono);letter-spacing:-.02em;line-height:1}
.sum span{font-size:12px;color:var(--ink-3);font-weight:500}
.sum hr{width:1px;align-self:stretch;border:0;background:rgba(40,42,50,.1)}
.dept{display:flex;align-items:center;gap:14px;text-align:left;border-radius:16px;padding:14px;width:100%}
.dept.main{border:2px solid var(--accent)}
.dept .ic{width:56px;height:56px;flex:none;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 18px var(--mono)}
.dept.soon{background:rgba(255,255,255,.35);border:1px solid var(--glass-line);color:var(--ink-3);padding:12px 14px}
.dept.soon .ic{width:46px;height:46px;background:rgba(255,255,255,.45);color:var(--ink-3);font-size:15px}
.tlist{display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.tlist button{display:flex;align-items:center;gap:10px;padding:11px 14px;text-align:left;border-top:1px solid rgba(255,255,255,.55);width:100%}
.tlist button:first-child{border-top:0}
.tlist .tm{font:600 14px var(--mono);color:var(--ink-3);flex:none;width:44px}
.tlist .vd{opacity:.55;text-decoration:line-through}

/* fields */
.sel{height:54px;border-radius:14px;border:2px solid var(--accent);font-size:17px;padding:0 12px;width:100%;background:var(--glass);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx);box-shadow:var(--shadow);color:var(--ink)}
.sel.ok{border:1.5px solid var(--glass-line)}
.tap{height:56px;border-radius:14px;text-align:left;padding:0 14px;font:600 24px var(--mono);width:100%;color:var(--ink)}
.f-act{border:2.5px solid var(--accent)!important;background:var(--glass)!important}
.f-empty{border:1.5px dashed var(--red)!important}
.f-ok{border:1.5px solid var(--glass-line)!important}
.caret::after{content:'▏';animation:blink 1s steps(1) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.auto{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:center}
.auto span{color:var(--ink-3)}.auto b{font-family:var(--mono);text-align:right}
.auto select{border:0;background:transparent;font:700 14px var(--mono);text-align:right;text-align-last:right;width:100%}

/* fish lines */
.fl{border-radius:16px;overflow:hidden}
.fl-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left}
.num{width:28px;height:28px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 14px var(--mono)}
.num.on{background:var(--accent);color:#fff}
.fl-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{height:72px;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:6px 12px;border-radius:12px;text-align:left;border:1.5px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx);box-shadow:var(--shadow);overflow:hidden}
.tile .t-l{font-size:12px;font-weight:600;color:var(--ink-3);display:flex;justify-content:space-between;width:100%;gap:4px}
.tile select,.tile input{width:100%;height:34px;border:0;background:transparent;font:700 16px var(--mono);padding:0;color:var(--ink)}
.tile input{border-bottom:2px solid var(--accent);text-transform:uppercase}
.tile input[data-on=typesup]{text-transform:none;font:600 17px var(--sans,inherit)}
.tile .t-v{display:flex;align-items:baseline;gap:6px;width:100%}
.tile .t-v b{font:700 20px var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit{font-size:12px;font-weight:700;color:#fff;padding:2px 8px;border-radius:999px}
.u-g{background:var(--teal)}.u-kg{background:var(--accent)}
.tile.size.filled{background:var(--teal-soft)}.tile.wt.filled{background:var(--accent-soft)}
.linkbtn{color:var(--accent);font-size:12px;font-weight:700;padding:0}
.sample{display:flex;justify-content:space-between;align-items:center;font-size:14px;background:var(--accent-soft);border-radius:10px;padding:6px 12px}
.sample b{font:600 17px var(--mono);color:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tog>span{font-size:15px;font-weight:600}
.seg{display:flex;border:1.5px solid var(--glass-line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 12px;min-width:74px;font-size:14px;font-weight:600;background:rgba(255,255,255,.35)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.warn{background:var(--red)}
.addline{border:1.5px dashed var(--accent);color:var(--accent);border-radius:14px;padding:12px;font-size:16px;font-weight:600;width:100%}
.ibtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink-3);font-size:15px;flex:none}
.ibtn.confirm{width:auto;padding:0 10px;background:var(--red);color:#fff;font-weight:700;border-color:var(--red)}

/* inspect */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{height:0}
.tabs button{flex:none;padding:9px 12px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.temp{min-width:124px;line-height:1.1;text-align:center;padding:10px 12px;border-radius:14px;font:600 28px var(--mono);border:2.5px solid var(--accent);background:var(--glass)}
.temp.ok{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}
.temp.bad{background:var(--red-soft);color:var(--red);border:2px solid var(--red)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chips button{min-height:42px;padding:6px 8px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;background:rgba(255,255,255,.35);border:1.5px solid var(--glass-line)}
.chips button.zero{color:var(--red-ink);border:1.5px dashed #e0a5a7;background:var(--glass)}
.chips button.on{background:var(--red);color:#fff;border-color:var(--red);animation:chipIn 280ms var(--ease)}
@keyframes chipIn{from{transform:scale(.92)}to{transform:none}}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.strip::-webkit-scrollbar{height:0}
.strip button{flex:none;width:46px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 13px var(--mono);border:1.5px solid var(--glass-line);background:var(--glass);color:var(--ink-3)}
.strip button small{font-size:9px;color:var(--ink-3)}
.strip .here{border:2.5px solid var(--accent);color:var(--ink)}
.strip .tok{border-color:var(--green);background:var(--green-soft);color:var(--ink)}
.strip .tbad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.strip .dfx{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.strip .rest{width:auto;min-width:60px;font-size:12px;font-weight:600;font-family:inherit;border:1.5px dashed var(--accent);background:transparent;color:var(--accent)}
.strip .rest.here{border-style:solid;background:var(--glass);color:var(--ink)}
.lsum{padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px}
.ls-ok{background:var(--green-soft);color:var(--green)}.ls-warn{background:var(--amber-soft);color:var(--amber-ink)}.ls-bad{background:var(--red);color:#fff}
.rest-list{border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.45)}
.rrow:first-child{border-top:0}
.rrow.found{background:var(--amber-soft)}.rrow.fail{background:var(--red-soft)}
.rrow .rl{display:flex;flex-direction:column;flex:1;min-width:0}
.rrow .rl small{font-size:12px;color:var(--ink-3)}.rrow.fail .rl small{color:var(--red);font-weight:700}
.step{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--glass-line);background:var(--glass);font:700 22px var(--mono)}
.rn{min-width:40px;text-align:center;font:700 20px var(--mono);color:var(--ink-3)}
.found .rn{color:var(--amber)}.fail .rn{color:var(--red)}

/* summary */
.sl{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sl.bad{border:2px solid var(--red)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:13px;color:var(--ink-3)}
.kv b{display:block;font:600 16px var(--mono);color:var(--ink)}
.kv b.bad{color:var(--red)}
.rng{display:flex;align-items:center;gap:6px;width:100%}
.rng button{flex:1;min-width:0;height:34px;border-radius:9px;border:1.5px solid var(--glass-line);background:rgba(255,255,255,.45);font:700 18px var(--mono);color:var(--ink)}
.rng button.f-act{border:2.5px solid var(--accent);background:var(--glass)}
.rng i{font-style:normal;color:var(--ink-3);font-weight:700}
.truck{position:relative;width:112px;height:80px;flex:none;border:2px solid var(--ink-3);border-radius:8px;background:rgba(255,255,255,.35)}
.truck b{position:absolute;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);background:var(--glass);border:1.5px solid var(--glass-line);color:var(--ink-3)}
.truck b.pt-ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.truck b.pt-bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.truck b.pt-now{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.12)}
.truck .p1{left:4px;top:4px}.truck .p2{right:4px;top:4px}.truck .p3{right:4px;bottom:4px}.truck .p4{left:4px;bottom:4px}.truck .p5{left:42px;top:26px}
.ck{display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.ck button{display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;border-top:1px solid rgba(255,255,255,.45);font-size:15px;font-weight:500;background:transparent;width:100%}
.ck button:first-child{border-top:0}
.ck .mk{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--green-soft);color:var(--green)}
.ck button.x{background:var(--red-soft)}.ck button.x .mk{background:var(--red);color:#fff}
.ck button small{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px}
.ck button.na{opacity:.55}.ck button.na .mk{background:transparent;color:var(--ink-3)}
.strip .g0{margin-left:8px}
.fixes{display:flex;flex-wrap:wrap;gap:6px}
.fixes button{padding:9px 13px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(255,255,255,.35);border:1.5px solid var(--glass-line)}
.fixes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rc{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:8px 12px;width:100%;text-align:left}
.rc b{font:600 20px var(--mono)}

/* done */
.done{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:30px;text-align:center}
.tick{width:120px;height:120px;border-radius:50%;background:rgba(219,233,213,.8);display:grid;place-items:center;animation:popc 520ms var(--ease) both,ring 1.6s ease-out 520ms 2}
.tick div{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:46px;font-weight:700;animation:popc 520ms var(--ease) 160ms both}
.tick.wait{background:rgba(245,233,212,.85);animation:popc 520ms var(--ease) both}
.tick.wait div{background:var(--amber)}
@keyframes popc{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(46,107,60,.35)}100%{box-shadow:0 0 0 22px rgba(46,107,60,0)}}

/* number pad (iOS keyboard) */
#pad{flex:none;background:rgba(210,222,228,.6);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(255,255,255,.6);padding:6px 8px 8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
#pad:empty{display:none}
#pad.up{animation:padUp 280ms var(--ease) both}
@keyframes padUp{from{transform:translateY(100%)}to{transform:none}}
#pad button{height:46px;border-radius:12px;font:600 22px var(--mono);background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 1px 0 rgba(40,42,50,.18)}
#pad button.fn{background:rgba(170,186,196,.55)}
#pad button.blank{background:transparent;box-shadow:none;cursor:default}
#pad button.ok{grid-column:1/-1;height:44px;font-size:16px;font-weight:700;font-family:inherit;background:var(--accent);color:#fff}

/* action bar */
#act{flex:none;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0));background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid rgba(255,255,255,.6);display:flex;gap:8px}
#act:empty{display:none}
.btn{flex:1;height:50px;border-radius:14px;font-size:17px;font-weight:700;background:var(--ink);color:#fff;box-shadow:0 8px 20px -8px rgba(20,22,18,.5);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.green{background:var(--green);box-shadow:0 8px 20px -8px rgba(46,107,60,.6)}
.btn.ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid var(--glass-line);box-shadow:none;flex:0 0 auto;padding:0 16px}
.btn:disabled{opacity:.35}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* bottom sheet + toast */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(40,42,50,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 240ms var(--ease)}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .box{width:100%;max-width:480px;max-height:85%;overflow-y:auto;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px;transform:translateY(30px);transition:transform 380ms var(--ease)}
#sheet.open .box{transform:none}
#sheet textarea{width:100%;min-height:70px;border-radius:12px;border:1.5px solid rgba(40,42,50,.15);padding:10px;font:inherit;font-size:16px;background:#fff}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;z-index:60;background:rgba(27,28,26,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90%;text-align:center;transition:opacity 240ms var(--ease),transform 240ms var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---- PC screens (pc.html) — same design system as RM ---- */
.dchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dchips>*{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;border-radius:12px;background:var(--glass);border:1.5px solid var(--glass-line);box-shadow:var(--shadow);text-align:center;overflow:hidden}
.dchips b{font-size:13px;font-weight:700;line-height:1.15}
.dchips small{font:600 12px var(--mono);color:var(--ink-3)}
.dchips .on{background:var(--accent);border-color:var(--accent);color:#fff;animation:chipIn 280ms var(--ease)}
.dchips .on small{color:rgba(255,255,255,.85)}
.dchips input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.lotc{border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.lotc .lh{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.lotno{font:700 17px var(--mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:3px 9px;flex:none}
.lline{display:flex;align-items:center;gap:10px;padding:11px 14px;text-align:left;border-top:1px solid rgba(255,255,255,.55);width:100%}
.lline.on{background:var(--accent-soft)}
.lline .go{font-size:22px;color:var(--accent);flex:none}
.ic2{width:44px;height:44px;flex:none;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 15px var(--mono)}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:1.5px solid var(--glass-line);background:var(--glass);box-shadow:var(--shadow);min-height:84px;justify-content:center}
.tt small{font-size:11px;font-weight:600;color:var(--ink-3)}
.tt b{font:700 26px var(--mono);line-height:1.1}
.tt.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.tt.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.tt.f-empty{border-style:dashed;border-color:var(--accent)}
.lossbox{display:flex;align-items:baseline;gap:10px;border-radius:14px;padding:10px 14px;background:var(--glass);border:1.5px solid var(--glass-line);box-shadow:var(--shadow);flex-wrap:wrap}
.lossbox span{font-size:14px;font-weight:600;color:var(--ink-3)}
.lossbox b{font:700 30px var(--mono);letter-spacing:-.02em}
.lossbox small{flex-basis:100%;font-size:13px;font-weight:600}
.lossbox.ok{background:var(--green-soft);border-color:rgba(46,107,60,.35)}.lossbox.ok b{color:var(--green)}
.lossbox.hi{background:var(--amber-soft);border-color:var(--amber)}.lossbox.hi b,.lossbox.hi small{color:var(--amber)}
.fixes button small{font-size:12px}

</head>

const sentIds = {};
function persist() {
  try {
    const stored = (JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}).outbox || [];
    stored.forEach((o) => { if (o && o.record && !sentIds[o.record.id] && !S.outbox.some((x) => x.record.id === o.record.id)) S.outbox.push(o); });

}

const t = () => L[S.lang] || L.th;
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => o[k]);
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P2 = (n) => String(n).padStart(2, '0');
const nowHM = () => { const d = new Date(); return P2(d.getHours()) + ':' + P2(d.getMinutes()); };
const dayStr = (d) => d.getFullYear() + '-' + P2(d.getMonth() + 1) + '-' + P2(d.getDate());
const todayStr = () => dayStr(new Date());
const addDays = (s, n) => { const p = s.split('-').map(Number); return dayStr(new Date(p[0], p[1] - 1, p[2] + n)); };
const daysBetween = (a, b) => { const p = a.split('-').map(Number), q = b.split('-').map(Number); return Math.round((new Date(q[0], q[1] - 1, q[2]) - new Date(p[0], p[1] - 1, p[2])) / 86400000); };
const ddmm = (s) => (s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '');
const numFmt = (v) => (v === '' || v === null || v === undefined ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 }));
const wShow = (w) => { const p = String(w).split('.'); return Number(p[0] || 0).toLocaleString('en-US') + (p.length > 1 ? '.' + p[1] : ''); };
const EMPTY_PC = { trims: [{ code: 'G', name: 'ควักไส้ / Gutted', maxLoss: null }, { code: 'H/L', name: 'ตัดหัว / Headless', maxLoss: null }], settings: { TEMP_MAX: 2, HOLD_WARN: 2 }, cancelDepts: ['general manager'] };
const pcCfg = () => (S.cfg && S.cfg.pc) || (DEMO ? DEMO_CFG.pc : EMPTY_PC);

const tempMax = () => Number(pcCfg().settings && pcCfg().settings.TEMP_MAX) || 2;

/* ---------------- rules (same as the server) ---------------- */
function newId() {
  const d = new Date();
  const r = Math.random().toString(36).slice(2, 8).toUpperCase().padEnd(6, 'X');
  return 'PC-' + String(d.getFullYear()).slice(2) + P2(d.getMonth() + 1) + P2(d.getDate()) + '-' + P2(d.getHours()) + P2(d.getMinutes()) + '-' + r;
}
function blankCheck(rmDate) {
  return { id: newId(), date: todayStr(), rmDate: rmDate || todayStr(), lot: '', rmId: '', rmLine: '', sup: '', fish: '', proc: 'WR', size: '', rmStatus: '', manual: false,
    trim: S.trimLast || '', temps: ['', '', ''], ti: 0, recheck: '', fix: '', before: '', after: '', remark: '', stage: 'lot' };
}
const itemOf = (c) => (c.fish ? c.fish + (c.proc ? '-' + c.proc : '') : '');
const heldOf = (c) => Math.max(0, daysBetween(c.rmDate, c.date || todayStr()));
function evalCheck(c) {
  const vals = c.temps.map((v) => (v === '' || v === '-' || isNaN(Number(v)) ? null : Number(v)));
  const got = vals.filter((v) => v !== null);
  const max = got.length ? Math.max.apply(null, got) : null;
  const warm = max !== null && max > tempMax();
  const rc = c.recheck === '' || isNaN(Number(c.recheck)) ? null : Number(c.recheck);
  const tFail = warm && !(rc !== null && rc <= tempMax());
  const b = Number(c.before), a = Number(c.after);
  const loss = b > 0 && a > 0 && a <= b ? Math.round(((b - a) / b) * 10000) / 100 : null;
  const tr = pcCfg().trims.find((x) => x.code === c.trim);
  const lim = tr && tr.maxLoss !== null && tr.maxLoss !== undefined && tr.maxLoss !== '' ? Number(tr.maxLoss) : null;
  const why = [];
  if (!c.lot || !c.fish) why.push('lot');
  if (!c.trim) why.push(t().needTrim);
  if (vals[0] === null) why.push(t().needT1);
  if (!(b > 0) || !(a > 0)) why.push(t().needW); else if (a > b) why.push(t().afterBig);
  if (warm && !c.fix) why.push(t().needFix);
  return { vals, max, warm, tFail, loss, lim, high: lim !== null && loss !== null && loss > lim, held: heldOf(c), ok: !why.length, why,
    status: tFail ? 'fail' : warm ? 'fixed' : 'pass' };
}

/* ---------------- talking to Apps Script ---------------- */
function api(action, params, timeoutMs) {
  if (DEMO) return demoApi(action, params || {});
  const ctl = 'AbortController' in window ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs || 25000) : null;
  return fetch(API_URL, {
    method: 'POST', mode: 'cors', cache: 'no-cache', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, params || {})),
    signal: ctl ? ctl.signal : undefined
  }).then((r) => {
    if (!r.ok) throw netErr('HTTP ' + r.status);
    return r.json().catch(() => { throw netErr('bad response'); });
  }, (e) => { throw netErr(e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'network'); })
    .then((j) => { if (!j || j.ok === false) { const e = new Error((j && j.error) || 'error'); e.code = j && j.code; throw e; } return j; })
    .finally(() => timer && clearTimeout(timer));
}
function netErr(m) { const e = new Error(m); e.net = true; return e; }

/* ---------------- sending saved checks (outbox) ---------------- */
let flushing = false, retryTimer = null;
function flush() {
  if (flushing || !S.outbox.length) return Promise.resolve();
  flushing = true;
  const next = () => {
    const item = S.outbox.find((o) => !o.hold);
    if (!item) return Promise.resolve();
    item.record.sentLate = Date.now() - item.savedAt > 10 * 60 * 1000;
    return api('pcSave', { staffId: item.staffId, record: item.record }, 45000).then((j) => {
      if (j && j.report && j.report !== 'ok') { S.reportWarn = { lot: item.record.lot, at: nowHM(), msg: String(j.report).slice(0, 160) }; toast(t().reportBad); }
      else if (j && j.report === 'ok') S.reportWarn = null;
      S.outbox = S.outbox.filter((o) => o !== item);
      sentIds[item.record.id] = true;
      S.online = true;
      if (S.last && S.last.id === item.record.id) { S.last.sent = true; S.last.report = j && j.report; }
      persist(); render();
      return next();
    }, (e) => {
      if (e.code === 'INVALID' || e.code === 'STAFF') { item.hold = true; item.err = e.message; persist(); render(); return next(); }
      throw e;
    });
  };
  return next().then(() => { flushing = false; refreshToday(true); }, (e) => {
    flushing = false; if (e && e.net) S.online = false; render();
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 20000);
  });
}
let todayAt = 0;
function refreshToday(force) {
  if (!S.staff || (!force && Date.now() - todayAt < 30000)) return;
  todayAt = Date.now();
  api('pcToday', { staffId: S.staff.id, date: todayStr() }).then((j) => {
    S.today = { date: todayStr(), checks: j.checks, totals: j.totals }; S.online = true; persist(); render();
  }, (e) => { if (e.net) { S.online = false; render(); } });
}
let cfgAt = 0;
function refreshConfig(force) {
  if (!S.staff || (!force && Date.now() - cfgAt < 5000)) return;
  cfgAt = Date.now();
  api('getConfig', { staffId: S.staff.id }).then((j) => { S.cfg = j; S.online = true; persist(); render(); },
    (e) => { if (e.code === 'STAFF') { signOut(); toast(t().badId); return; } if (e.net) S.online = false; render(); });
}
function loadLots(date, force) {
  if (!S.staff || !date) return;
  const have = S.lots[date];
  if (have && !force && Date.now() - have.at < 60000) return;
  S.lotsBusy = true; render();
  api('pcLots', { staffId: S.staff.id, date: date }).then((j) => {
    S.lots[date] = { lots: j.lots, at: Date.now() }; S.lotsBusy = false; S.online = true; persist(); render();
  }, (e) => { S.lotsBusy = false; if (e.net) S.online = false; else S.err = e.message; render(); });
}

function renderHeader() {

  const backTo = { lot: 'home', manual: 'lot', check: 'lot', done: 'home' }[S.screen];

    : pend ? '<span class="net wait">' + T.waiting + ' ' + pend + '</span>' : '<span class="net on">' + T.online + '</span>';

    (backTo ? '<button class="back" data-act="back" aria-label="' + T.back + '">‹</button>' : '') +
    '<div><b>' + (S.screen === 'login' ? 'CK QC' : esc(T.pcShort)) + '</b><small>CK QC · PC · ' + esc(branch()) + '</small></div></div>' +
    '<div class="hright"><div class="langs">' + [['th', 'ไทย'], ['en', 'EN'], ['my', 'မြန်မာ']].map((x) =>

function viewPad() {

  let h = keys.map((x) => x === '' ? '<button class="blank" tabindex="-1" aria-hidden="true"></button>' :
    '<button class="' + (x === 'del' || x === 'pm' || x === '/' || x === '.' ? 'fn' : '') + '" data-key="' + x + '" aria-label="' + (x === 'del' ? 'delete' : x === 'pm' ? 'plus minus' : x) + '">' + (x === 'del' ? '⌫' : x === 'pm' ? '+/−' : x) + '</button>').join('');
  const okLabel = k === 'sid' ? (S.busy ? '<span class="spin"></span> ' + T.checking : T.enter) : T.ok + ' ✓';
  h += '<button class="ok" data-key="ok"' + (k === 'sid' && (S.sid.length !== 7 || S.busy) ? ' disabled style="opacity:.45"' : '') + '>' + okLabel + '</button>';
  return h;
}
/** digits → temperature: 2 digits = d.d (1 2 → 1.2) · 3 digits = dd.d (1 2 3 → 12.3) · one digit + OK = d.0 */
function tempOf(buf, need) {
  const neg = buf[0] === '-';
  const dg = buf.replace('-', '');
  if (!dg) return '';
  let v;
  if (need === 3 && dg.length >= 3) v = String(Number(dg.slice(0, 2))) + '.' + dg[2];
  else if (dg.length >= 2) v = need === 3 ? String(Number(dg)) + '.0' : dg[0] + '.' + dg[1];
  else v = dg[0] + '.0';
  return (neg && Number(v) !== 0 ? '-' : '') + v;
}
function press(key) {
  const pad = S.pad;
  if (!pad) return;
  const c = S.c;
  if (pad.kind === 'sid') {
    if (key === 'del') S.sid = S.sid.slice(0, -1);
    else if (key === 'ok') return login();
    else if (/^\d$/.test(key) && S.sid.length < 7) { S.sid += key; S.peek = true; clearTimeout(press.peekT); press.peekT = setTimeout(() => { S.peek = false; render(); }, 600); }
    S.err = '';
    return render();
  }
  if (pad.kind === 'lot') {
    if (key === 'del') c.lot = c.lot.slice(0, -1);
    else if (key === 'ok') S.pad = null;
    else if ((/^\d$/.test(key) || key === '/') && c.lot.length < 12) c.lot += key;
    return render();
  }
  if (pad.kind === 'gb' || pad.kind === 'ga') {
    const f = pad.kind === 'gb' ? 'before' : 'after';
    const v = String(c[f] || '');
    if (key === 'ok') S.pad = pad.kind === 'gb' && !c.after ? { kind: 'ga' } : null;
    else if (key === 'del') c[f] = v.slice(0, -1);
    else if (key === '.' ? v && v.indexOf('.') < 0 : /^\d$/.test(key) && v.replace('.', '').length < 7 && !(v === '' && key === '0') && !(v.split('.')[1] || '').match(/^\d$/)) c[f] = v + key;
    S.err = '';
    return render();
  }
  if (pad.kind === 'prt') {
    let buf = S.buf;
    if (key === 'ok') { if (buf && buf !== '-') c.recheck = tempOf(buf, 2) || c.recheck; S.pad = null; S.buf = ''; return render(); }
    if (key === 'pm') { if (buf) S.buf = buf[0] === '-' ? buf.slice(1) : '-' + buf; else if (c.recheck) c.recheck = c.recheck[0] === '-' ? c.recheck.slice(1) : '-' + c.recheck; else S.buf = '-'; return render(); }
    if (key === 'del') { if (buf) S.buf = buf.slice(0, -1); else c.recheck = ''; return render(); }
    if (!/^\d$/.test(key)) return;
    buf += key;
    if (buf.replace('-', '').length >= 2) { c.recheck = tempOf(buf, 2); S.buf = ''; S.pad = null; } else S.buf = buf;
    return render();
  }
  if (pad.kind === 'pt') {
    const i = pad.i;
    const need = S.wide ? 3 : 2;
    let buf = S.buf;
    // after a reading: next empty optional box, then the weights (temperature 1 is the only required one)
    const after = () => { S.buf = ''; S.wide = false; const nx = [1, 2].find((k) => k > i && c.temps[k] === ''); S.pad = nx !== undefined ? { kind: 'pt', i: nx } : !c.before ? { kind: 'gb' } : null; };
    if (key === 'ok') {
      if (buf.replace('-', '')) { c.temps[i] = tempOf(buf, need); after(); }
      else { S.buf = ''; S.wide = false; S.pad = i === 0 && c.temps[0] === '' ? pad : !c.before ? { kind: 'gb' } : null; }
      return render();
    }
    if (key === 'pm') {
      if (buf) S.buf = buf[0] === '-' ? buf.slice(1) : '-' + buf;
      else if (c.temps[i] !== '') c.temps[i] = c.temps[i][0] === '-' ? c.temps[i].slice(1) : '-' + c.temps[i];
      else S.buf = '-';
      return render();
    }
    if (key === 'del') { if (buf) S.buf = buf.slice(0, -1); else c.temps[i] = ''; return render(); }
    if (!/^\d$/.test(key)) return;
    buf += key;
    if (buf.replace('-', '').length < need) { S.buf = buf; return render(); }
    c.temps[i] = tempOf(buf, need);
    after();
    return render();
  }
}

/* ---------------- action bar ---------------- */
function viewAction() {
  const T = t();
  const s = S.screen;
  if (s === 'manual') return '<button class="btn" data-act="usemanual"' + (S.c.lot && S.c.fish ? '' : ' disabled') + '>' + T.useManual + '</button>';
  if (s === 'check') return '<button class="btn green" data-act="save"' + (evalCheck(S.c).ok && !S.busy ? '' : ' disabled') + '>✓ ' + T.save + '</button>';
  if (s === 'done') return '<button class="btn ghost" data-act="home">' + T.home + '</button><button class="btn" data-act="again">' + T.again + '</button>';
  return '';
}

/* ---------------- render ---------------- */
const $ = (id) => document.getElementById(id);
let rendering = false, renderAgain = false;
function render() {
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; render(); }
}
function draw() {
  document.body.className = 'lang-' + S.lang;
  document.documentElement.lang = S.lang;
  const main = $('main');
  const keepScroll = lastScreen === S.screen ? main.scrollTop : 0;
  if (['lot', 'manual', 'check'].indexOf(S.screen) >= 0 && !S.c) S.screen = 'home';
  if (S.screen !== 'login' && !S.staff) S.screen = 'login';
  $('hdr').innerHTML = renderHeader();
  const views = { login: viewLogin, home: viewHome, lot: viewLot, manual: viewManual, check: viewCheck, done: viewDone };
  main.innerHTML = (views[S.screen] || viewHome)();
  if (lastScreen !== S.screen) {
    main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter');
    clearTimeout(render.enterT); render.enterT = setTimeout(() => main.classList.remove('enter'), 700);
  }
  main.scrollTop = keepScroll;
  const ph = document.querySelector('.phone'); if (ph && ph.scrollLeft) ph.scrollLeft = 0;
  const pad = $('pad');
  pad.innerHTML = viewPad();
  if (S.pad && !lastPad) { pad.classList.remove('up'); void pad.offsetWidth; pad.classList.add('up'); }
  lastPad = !!S.pad;
  $('act').innerHTML = viewAction();
  lastScreen = S.screen;
  persist();
}

/* ---------------- actions ---------------- */
function login() {
  if (S.sid.length !== 7 || S.busy) return;
  S.busy = true; S.err = ''; render();
  api('validateStaff', { staffId: S.sid }).then((j) => {
    S.busy = false;
    if (!j.valid) { S.err = t().badId; return render(); }
    S.staff = { id: S.sid, name: j.name || '', dept: j.department || '' };
    (S.known = S.known || {})[S.sid] = { name: S.staff.name, dept: S.staff.dept };
    S.online = true;
    go('home', { pad: null });
    refreshConfig(true); refreshToday(true);
  }, (e) => {
    S.busy = false;
    const k = e.net && S.known && S.known[S.sid];
    if (k) { S.staff = { id: S.sid, name: k.name, dept: k.dept }; S.online = false; go('home', { pad: null }); flush(); return; }
    S.err = e.net ? t().needNet : e.message; render();
  });
}
function signOut() {
  if (S.c && !S.confirmOut) { S.confirmOut = true; toast(t().outDraft); clearTimeout(signOut.t); signOut.t = setTimeout(() => (S.confirmOut = false), 4000); return; }
  S.confirmOut = false;
  S.staff = null; S.sid = ''; S.today = null; S.c = null; todayAt = 0;
  go('login', { pad: { kind: 'sid' } });
}
function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}
function startCheck() {
  S.c = blankCheck(todayStr());
  go('lot');
  loadLots(S.c.rmDate);
  refreshConfig();
}
function saveCheck() {
  const c = S.c;
  const e = evalCheck(c);
  if (!e.ok) { S.err = e.why.join(' · '); return render(); }
  const rec = {
    id: c.id, date: todayStr(), time: nowHM(), rmDate: c.rmDate, lot: c.lot, rmId: c.rmId, rmLine: c.rmLine, sup: c.sup,
    item: itemOf(c), size: c.size, trim: c.trim, temps: c.temps.slice(), recheck: e.warm ? c.recheck : '', fix: e.warm ? c.fix : '',
    before: c.before, after: c.after, remark: c.remark, device: navigator.userAgent.slice(0, 120), appVersion: APP_VERSION,
    _status: e.status === 'fail' ? 'ไม่ผ่าน' : e.status === 'fixed' ? 'ผ่านหลังแก้ไข' : 'ผ่าน', _loss: e.loss
  };
  S.trimLast = c.trim;
  S.outbox.push({ record: rec, staffId: S.staff.id, savedAt: Date.now(), draft: JSON.parse(JSON.stringify(c)) });
  S.last = { id: rec.id, lot: c.lot, item: rec.item, size: c.size, status: rec._status, held: e.held, loss: e.loss, high: e.high, sent: false,
    again: { rmDate: c.rmDate, lot: c.lot, rmId: c.rmId, rmLine: c.rmLine, sup: c.sup, fish: c.fish, proc: c.proc, size: c.size, rmStatus: c.rmStatus, manual: c.manual, trim: c.trim } };
  S.c = null;
  go('done');
  flush();
}
function openCheckSheet(id) {
  const T = t();
  const td = (S.today && S.today.checks) || [];
  const r = td.find((x) => x.id === id);
  const pend = S.outbox.find((o) => o.record.id === id);
  if (!r && !pend) return;
  const x = r || { item: pend.record.item, size: pend.record.size, lot: pend.record.lot, rmDate: ddmm(pend.record.rmDate), time: pend.record.time, loss: pend.record._loss, status: pend.record._status, held: Math.max(0, daysBetween(pend.record.rmDate, pend.record.date)) };
  let h = '<div class="row"><b class="grow" style="font-size:18px">' + esc(x.item) + ' ' + esc(x.size || '') + '</b><button class="ibtn" data-act="closesheet" aria-label="' + T.close + '">✕</button></div>' +
    '<div class="sub">Lot ' + esc(x.lot) + ' · ' + T.rcv + ' ' + esc(x.rmDate) + ' · ' + esc(x.time) + (r && r.staffName ? ' · ' + T.by + ' ' + esc(r.staffName) : '') + '</div>' +
    '<div class="row" style="flex-wrap:wrap;gap:6px">' + statusPill(x.status) + heldPill(x.held) + (r && r.trim ? '<span class="pill p-mute">' + esc(r.trim) + '</span>' : '') + '</div>' +
    (x.loss !== null && x.loss !== undefined && x.loss !== '' ? '<div class="lossbox ' + (r && /^สูง/.test(r.lossCheck || '') ? 'hi' : 'ok') + '"><span>' + T.loss + '</span><b>' + Number(x.loss).toFixed(2) + '%</b><small></small></div>' : '');
  if (r && r.void) h += '<div class="note">' + T.cancelled + ' · ' + esc(r.voidReason) + '</div>';
  else if (pend) h += '<div class="note">' + T.pendingSub + '</div>';
  else if (!canCancel()) h += '<div class="note">🔒 ' + T.gmOnly + '</div>';
  else {
    h += '<span class="lbl" style="color:var(--ink)">' + T.cancelT + '</span><div class="fixes">' + T.reasons.map((q, i) => '<button data-act="reason" data-v="' + i + '">' + esc(q) + '</button>').join('') + '</div>' +
      '<textarea id="why" placeholder="' + esc(T.cancelWhy) + '"></textarea><button class="btn" style="background:var(--red);flex:none" data-act="dovoid" data-v="' + esc(id) + '">' + T.confirmCancel + '</button>';
  }
  $('sheet').innerHTML = '<div class="box">' + h + '</div>';
  $('sheet').classList.add('open');
}
function canCancel() {
  const deps = (pcCfg().cancelDepts && pcCfg().cancelDepts.length ? pcCfg().cancelDepts : ['general manager']);
  return !!(S.staff && deps.indexOf(String(S.staff.dept || '').trim().toLowerCase()) >= 0);
}
function closeSheet() { $('sheet').classList.remove('open'); }

const ACT = {
  lang: (el) => { S.lang = el.dataset.v; render(); },
  back: () => go({ lot: 'home', manual: 'lot', check: 'lot', done: 'home' }[S.screen] || 'home'),
  signout: signOut,
  mainmenu: toMainMenu,
  hidewarn: () => { S.reportWarn = null; render(); },
  hardrefresh: (el) => {
    el.disabled = true; el.innerHTML = '<span class="spin"></span>';
    persist();
    const reload = () => { try { sessionStorage.setItem(HAND_KEY, JSON.stringify({ staff: S.staff, lang: S.lang, at: Date.now() })); } catch (e) { /* ignore */ } const u = new URL(location.href); u.searchParams.set('r', Date.now()); location.replace(u.toString()); };
    const done = S.outbox.length && navigator.onLine ? flush() : Promise.resolve();
    Promise.race([done, new Promise((r) => setTimeout(r, 8000))]).then(reload, reload);
  },
  sendnow: () => { S.outbox.forEach((o) => { o.hold = false; o.err = ''; }); S.online = true; flush(); render(); },
  start: startCheck,
  resume: () => { go(S.c.stage || 'lot'); if (S.c && S.screen === 'lot') loadLots(S.c.rmDate); },
  discard: () => { if (S.confirm === 'discard') { S.c = null; S.confirm = null; } else S.confirm = 'discard'; render(); },
  home: () => go('home'),
  rmdate: (el) => { S.c.rmDate = el.dataset.v; S.err = ''; render(); loadLots(S.c.rmDate); },
  pickline: (el) => {
    const got = S.lots[S.c.rmDate];
    const lot = got && got.lots.find((x) => x.id === el.dataset.v);
    const l = lot && lot.lines.find((x) => Number(x.n) === Number(el.dataset.n));
    if (!l) return;
    Object.assign(S.c, { lot: lot.lot, rmId: lot.id, rmLine: l.n, sup: lot.sup, fish: l.fish, proc: l.proc, size: l.size, rmStatus: l.status, manual: false });
    go('check', { pad: S.c.temps[0] === '' ? { kind: 'pt', i: 0 } : null });
  },
  manual: () => { Object.assign(S.c, { rmId: '', rmLine: '', rmStatus: '', manual: true, lot: S.c.manual ? S.c.lot : '', fish: S.c.manual ? S.c.fish : '', size: S.c.manual ? S.c.size : '', sup: S.c.manual ? S.c.sup : '' }); go('manual', { pad: S.c.lot ? null : { kind: 'lot' } }); },
  usemanual: () => go('check', { pad: S.c.temps[0] === '' ? { kind: 'pt', i: 0 } : null }),
  focus: (el) => {
    const k = el.dataset.v;
    S.buf = ''; S.wide = false;
    S.pad = k === 'pt' ? { kind: 'pt', i: Number(el.dataset.i) } : { kind: k };
    render();
  },
  wide: () => { S.wide = !S.wide; S.buf = ''; render(); },
  trim: (el) => { S.c.trim = el.dataset.v; S.err = ''; render(); },
  fix: (el) => { const v = FIX_TH[Number(el.dataset.x)]; S.c.fix = S.c.fix === v ? '' : v; S.err = ''; render(); },
  save: saveCheck,
  again: () => {
    const a = S.last && S.last.again;
    if (!a) return go('home');
    S.c = Object.assign(blankCheck(a.rmDate), a);
    go('check', { pad: { kind: 'pt', i: 0 } });
  },
  reopen: (el) => {
    if (S.c) { toast(t().finishFirst); return; }
    const item = S.outbox.find((o) => o.record.id === el.dataset.v);
    if (!item || !item.draft) return;
    S.outbox = S.outbox.filter((o) => o !== item);
    sentIds[item.record.id] = true;
    S.c = item.draft;
    go('check');
  },
  check: (el) => openCheckSheet(el.dataset.v),
  closesheet: closeSheet,
  reason: (el) => { $('why').value = t().reasons[Number(el.dataset.v)]; },
  dovoid: (el) => {
    const why = ($('why').value || '').trim();
    if (!why) { $('why').focus(); return; }
    el.disabled = true; el.innerHTML = '<span class="spin"></span>';
    api('pcVoid', { staffId: S.staff.id, id: el.dataset.v, reason: why }).then(() => {
      closeSheet(); toast(t().cancelled); refreshToday(true);
    }, (e) => { el.disabled = false; el.textContent = t().confirmCancel; toast(e.net ? t().offline : e.message); });
  }
};

document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-key]');
  if (k && !k.disabled) { press(k.dataset.key); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act]) { if (a.tagName === 'LABEL') return; ACT[a.dataset.act](a); }
  if (e.target.id === 'sheet') closeSheet();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  const on = el.dataset && el.dataset.on;
  if (!on || !S.c) return;
  const c = S.c;
  if (on === 'rmdate') { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value) && el.value <= todayStr()) { c.rmDate = el.value; render(); loadLots(c.rmDate); } return; }
  if (on === 'mfish') { c.fish = el.value; return render(); }
  if (on === 'mproc') { c.proc = el.value; return render(); }
  if (on === 'msize') { c.size = el.value.toUpperCase().replace(/\s+/g, '').trim(); return render(); }
  if (on === 'msup') { c.sup = el.value.replace(/\s+/g, ' ').trim(); return render(); }
  if (on === 'remark') { c.remark = el.value.replace(/\s+/g, ' ').trim(); return render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  const on = el.dataset && el.dataset.on;
  if (!on || !S.c) return;
  if (on === 'msize') S.c.size = el.value.toUpperCase().replace(/\s+/g, '');
  if (on === 'msup') S.c.sup = el.value;
  if (on === 'remark') S.c.remark = el.value;
  $('act').innerHTML = viewAction();
  persist();
});
document.addEventListener('keydown', (e) => {
  if (!S.pad || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const map = { Backspace: 'del', Enter: 'ok', '-': 'pm', '/': '/', '.': '.' };
  const k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (k) { e.preventDefault(); press(k); }
});
window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) { persist(); render(); } });
window.addEventListener('online', () => { S.online = true; flush(); render(); });
window.addEventListener('offline', () => { S.online = false; render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.staff) { flush(); refreshToday(); } });

if (/[?&]r=\d+/.test(location.search)) { try { const u = new URL(location.href); u.searchParams.delete('r'); history.replaceState(null, '', u.toString()); } catch (e) { /* ignore */ } }
render();
if (S.staff) { refreshConfig(true); refreshToday(true); flush(); }
</script>
</body>
